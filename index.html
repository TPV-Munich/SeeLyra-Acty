
<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quick Guide: RealWear Navigator 520</title>

  <style>
    /* ===================== THEME SYSTEM ===================== */
    :root{
      --accent:#089ca4;        /* teal by default */
      --accent-2:#16c4cf;
      --bg:#0b1020;
      --bg-2:#0f152e;
      --card:rgba(255,255,255,.08);
      --text:#e8ecf4;
      --muted:#b7c1d6;
      --border:rgba(255,255,255,.18);
      --shadow-lg:0 10px 30px rgba(0,0,0,.35);
    }
    html[data-theme="teal"]{
      --accent:#089ca4;
      --accent-2:#15b8c1;
      --bg:#0b1020;
      --bg-2:#0f152e;
      --card:rgba(255,255,255,.08);
      --text:#e8ecf4;
      --muted:#b7c1d6;
      --border:rgba(255,255,255,.18);
    }
    html[data-theme="deep"]{
      --accent:#4f72ff;
      --accent-2:#71a1ff;
      --bg:#0b0f1e;
      --bg-2:#0e1632;
      --card:rgba(255,255,255,.10);
      --text:#e9eeff;
      --muted:#bac6ea;
      --border:rgba(255,255,255,.18);
    }
    html[data-theme="light"]{
      --accent:#089ca4;
      --accent-2:#16c4cf;
      --bg:#f6f8fb;
      --bg-2:#ffffff;
      --card:rgba(0,0,0,.04);
      --text:#0f182a;
      --muted:#4b5a78;
      --border:rgba(0,0,0,.12);
    }

    /* ===================== BASE LAYOUT ===================== */
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--accent) 28%, transparent), transparent 55%),
        radial-gradient(1000px 600px at 120% 10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      font:12px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}

    /* ===== Header ===== */
    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
      gap:12px;
    }
    .logo-img{
      width:420px;max-width:100%;height:auto;display:block;
    }

    /* ===== Card ===== */
    .card{
      border-radius:18px;
      overflow:hidden;
      background:linear-gradient(180deg,var(--card),var(--card));
      box-shadow:var(--shadow-lg);
      border:1px solid var(--border);
      backdrop-filter:saturate(120%) blur(6px);
    }
    .card-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
    }

    /* Title size tuned for mobile */
    .card-title{
      font-size:18px;   /* desktop/tablet */
      font-weight:800;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    /* ===== Buttons ===== */
    .btn{
      appearance:none;border:none;cursor:pointer;
      padding:10px 14px;border-radius:12px;font-weight:800;
      color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      box-shadow:0 6px 18px color-mix(in oklab, var(--accent) 45%, transparent);
      display:inline-flex;align-items:center;gap:6px;
      transition:transform .08s ease, filter .15s ease;
      text-decoration:none;
    }
    .btn:active{transform:scale(.97)}
    .btn.secondary{
      color:var(--text);
      background:transparent;
      border:1px solid var(--border);
      box-shadow:none;
    }

    /* ===== Viewer ===== */
    .viewer{
      /* svh fits phone screen better with browser bars */
      height:75svh;
      background:#000;
      position:relative;
    }
    .viewer iframe,
    .viewer object{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#1a1a1a;
    }

    .fallback{
      position:absolute;inset:0;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;padding:20px;text-align:center;background:#0f0f0f;
      color:#dcdcdc;
    }
    .fallback.hidden{display:none;}

    /* ===== Footer ===== */
    .foot{
      padding:10px 20px;
      border-top:1px solid var(--border);
      font-size:13px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    /* Small screens (phones) */
    @media (max-width:640px){
      .viewer{height:72svh;}
      .card-head{gap:6px}
      .actions{gap:6px}
      .btn{padding:9px 12px}

      /* Make the title smaller on mobile */
      .card-title{
        font-size:16px;   /* adjust to 12px if you want even smaller */
      }
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- Header -->
  <header class="header">
    BL_Technolas.png
    <button class="btn secondary" id="themeBtn" title="Change theme">Theme</button>
  </header>

  <!-- Card -->
  <section class="card">
    <div class="card-head">
      <div class="card-title">Quick Guide: RealWear Navigator 520 — PDF</div>
      <div class="actions">
        <button class="btn" id="openBtn" title="Open in new tab">Open</button>
        <a class="btn" id="downloadBtn" download="TPV-Munich.pdf" title="Download PDF">Download</a>
        <button class="btn" id="fullscreenBtn">Full screen</button>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <!-- Desktop prefers iframe -->
      <iframe id="pdfFrame" allow="fullscreen"></iframe>
      <!-- Mobile prefers object -->
      <object id="pdfObject" data="" type="application/pdf" aria-label="PDF"></object>

      <!-- Fallback -->
      <div class="fallback hidden" id="fallbackMsg">
        <strong>Can’t display the PDF here.</strong>
        <div>Some mobile browsers block embedded PDFs. Use <b>Open</b> to view it in a new tab.</div>
        <div>
          <a class="btn" id="fallbackOpen">Open</a>
          <a class="btn secondary" id="fallbackDownload" download="TPV-Munich.pdf">Download</a>
        </div>
      </div>
    </div>

    <div class="foot">
      <div>Tip: If the PDF doesn’t appear on some phones, tap <strong>Open</strong>.</div>
      <div>Powered By Technolas Bausch + Lomb</div>
    </div>

  </section>

</div>

<script>
  /* ================ CONFIG ================ */
  // Your file is in the root next to index.html
  const pdfUrl = 'TPV%20Munich.pdf';

  const frame   = document.getElementById('pdfFrame');
  const obj     = document.getElementById('pdfObject');
  const viewer  = document.getElementById('viewer');
  const fsBtn   = document.getElementById('fullscreenBtn');
  const themeBtn= document.getElementById('themeBtn');

  const openBtn = document.getElementById('openBtn');
  const dlBtn   = document.getElementById('downloadBtn');

  const fallbackMsg = document.getElementById('fallbackMsg');
  const fbOpen = document.getElementById('fallbackOpen');
  const fbDl   = document.getElementById('fallbackDownload');

  // Device detection
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/.test(ua);
  const isMobile = isIOS || isAndroid;

  /* ================ BUILD SRC WITH FIT PARAMS ================ */
  function buildPdfSrc() {
    // Mobile: FitH works better for width fit
    if (isMobile) return `${pdfUrl}#view=FitH`;
    // Desktop: try page-width + FitH
    return `${pdfUrl}#zoom=page-width&view=FitH`;
  }

  function useIframe() {
    frame.style.display = 'block';
    obj.style.display = 'none';
    frame.src = buildPdfSrc();
  }
  function useObject() {
    obj.style.display = 'block';
    frame.style.display = 'none';
    obj.data = buildPdfSrc();
  }

  function applyRenderer() {
    if (isMobile) useObject();
    else useIframe();
  }

  /* ================ ACTIONS ================ */
  openBtn.onclick = () => window.open(pdfUrl, '_blank', 'noopener,noreferrer');
  [dlBtn, fbDl].forEach(a => a.href = pdfUrl);
  fbOpen.href = pdfUrl;

  /* ================ FULLSCREEN ================ */
  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await (viewer.requestFullscreen?.call(viewer) ||
               viewer.webkitRequestFullscreen?.call(viewer));
      } else {
        await (document.exitFullscreen?.call(document) ||
               document.webkitExitFullscreen?.call(document));
      }
    } catch (e) {
      console.error('Fullscreen error:', e);
    }
  }
  fsBtn.onclick = toggleFullscreen;

  document.addEventListener('fullscreenchange', () => {
    fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  });

  /* ================ THEME ================ */
  const themes = ['teal','deep','light'];
  const saved = localStorage.getItem('pdf_theme') || 'teal';
  if (themes.includes(saved)) document.documentElement.setAttribute('data-theme', saved);
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'teal';
    const idx = themes.indexOf(current);
    const next = themes[(idx + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pdf_theme', next);
  });

  /* ================ INIT & FALLBACKS ================ */
  applyRenderer();

  // Show fallback message if embedding is blocked
  setTimeout(() => {
    const blocked =
      (isMobile && !obj.contentDocument) ||
      (!isMobile && !frame.contentDocument);
    if (blocked) {
      fallbackMsg.classList.remove('hidden');
    } else {
      fallbackMsg.classList.add('hidden');
    }
  }, 900);

  // Re-apply on orientation change
  let resizeTo;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTo);
    resizeTo = setTimeout(() => {
      if (isMobile) obj.data = buildPdfSrc();
      else frame.src = buildPdfSrc();
    }, 200);
  });

  // Optional console warning if file missing
  fetch(pdfUrl, { method:'GET' }).then(r => {
    if (!r.ok) {
      console.warn('PDF not found or blocked:', r.status);
      fallbackMsg.classList.remove('hidden');
    }
  }).catch(() => {});
</script>
</body>
</html>
