
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SeeLyra Acty Guide Support — PDF</title>

  <style>
    :root{
      --accent:#089ca4;
      --bg1:#0b1020;
      --bg2:#0f152e;
      --card:rgba(255,255,255,.08);
      --text:#e8ecf4;
      --muted:#b7c1d6;
      --border:rgba(255,255,255,.18);
    }

    html,body{height:100%}
    body{
      margin:0;
      font:15px system-ui,Segoe UI,Arial;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(8,156,164,.25), transparent 60%),
        radial-gradient(800px 500px at 110% 10%, rgba(8,156,164,.2), transparent 60%),
        linear-gradient(160deg,var(--bg1),var(--bg2));
    }

    .wrap{
      max-width:1100px;
      margin:28px auto;
      padding:0 16px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }

    .logo{
      opacity:.85;
      font-size:14px;
      font-weight:700;
    }

    .btn{
      border:0;
      cursor:pointer;
      padding:7px 12px;
      border-radius:12px;
      font-weight:700;
      font-size:13px;
      background:linear-gradient(135deg,#089ca4,#16c4cf);
      color:#fff;
    }

    .card{
      border-radius:18px;
      overflow:hidden;
      background:var(--card);
      border:1px solid var(--border);
    }

    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
      border-bottom:1px solid var(--border);
    }

    .title{
      font-size:17px;
      font-weight:800;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .viewer{
      height:75svh;
      background:#000;
    }

    iframe{
      width:100%;
      height:100%;
      border:0;
      background:#1a1a1a;
    }

    .foot{
      padding:10px 16px;
      border-top:1px solid var(--border);
      font-size:12px;
      color:var(--muted);
      display:flex;
      justify-content:space-between;
    }

    @media (max-width:640px){
      .viewer{height:70svh}
      .title{font-size:15px}
      .btn{font-size:12px;padding:6px 10px}
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="header">
    <div class="logo">BL_Technolas.png</div>
    <button class="btn" id="themeBtn">Theme</button>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="title">SeeLyra Acty Guide Support — PDF</div>
      <div class="actions">
        <button class="btn" onclick="openPDF()">Open</button>
        <a class="btn" href="TPV%20Munich.pdf" download>Download</a>
        <button class="btn" onclick="fullscreen()">Full screen</button>
      </div>
    </div>

    <!-- ✅ DIRECT PDF -->
    <div class="viewer" id="viewer">
      <iframe
        src="TPV%20Munich.pdf#view=FitH"
        allowfullscreen>
      </iframe>
    </div>

    <div class="foot">
      <div>Tip: Pinch to zoom inside the PDF</div>
      <div>Powered by Technolas Bausch + Lomb</div>
    </div>
  </div>

</div>

<script>
  function openPDF(){
    window.open('TPV%20Munich.pdf','_blank');
  }

  function fullscreen(){
    const v = document.getElementById('viewer');
    if(!document.fullscreenElement){
      v.requestFullscreen?.();
    }else{
      document.exitFullscreen?.();
    }
  }
</script>
</body>
</html>
