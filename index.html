
<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SeeLyra Acty Guide Support — PDF</title>

  <style>
    /* ===================== THEME ===================== */
    :root{
      --accent:#089ca4; --accent-2:#16c4cf;
      --bg:#0b1020; --bg-2:#0f152e;
      --card:rgba(255,255,255,.08);
      --text:#e8ecf4; --muted:#b7c1d6;
      --border:rgba(255,255,255,.18);
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    html[data-theme="deep"]{
      --accent:#4f72ff; --accent-2:#71a1ff;
      --bg:#0b0f1e; --bg-2:#0e1632; --card:rgba(255,255,255,.10);
      --text:#e9eeff; --muted:#bac6ea; --border:rgba(255,255,255,.18);
    }
    html[data-theme="light"]{
      --accent:#089ca4; --accent-2:#16c4cf;
      --bg:#f6f8fb; --bg-2:#ffffff; --card:rgba(0,0,0,.04);
      --text:#0f182a; --muted:#4b5a78; --border:rgba(0,0,0,.12);
    }

    /* ===================== LAYOUT ===================== */
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--accent) 28%, transparent), transparent 55%),
        radial-gradient(1000px 600px at 120% 10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}

    /* Header row (logo left, Theme button right) */
    .header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;
    }
    .logo { color:var(--muted); font-weight:700; font-size:14px; }
    .btn{
      appearance:none;border:0;cursor:pointer;text-decoration:none;white-space:nowrap;
      padding:8px 12px;border-radius:12px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      box-shadow:0 6px 18px color-mix(in oklab, var(--accent) 45%, transparent);
      display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease,filter .15s ease;
      font-size:13.5px; line-height:1;
    }
    .btn.secondary{
      color:var(--text); background:transparent; border:1px solid var(--border); box-shadow:none;
    }
    .btn:active{transform:scale(.97)}

    /* Card */
    .card{
      border-radius:18px; overflow:hidden;
      background:linear-gradient(180deg,var(--card),var(--card));
      border:1px solid var(--border); box-shadow:var(--shadow);
      backdrop-filter:saturate(120%) blur(6px);
    }
    .card-head{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; border-bottom:1px solid var(--border);
    }
    .card-title{
      font-weight:900; font-size:18px;
    }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }

    /* Viewer area (iframe to pdf.js) */
    .viewer{ height:75svh; background:#000; }
    .viewer iframe{ width:100%; height:100%; border:0; background:#121212; display:block; }

    /* Footer line */
    .foot{
      padding:10px 16px; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      color:var(--muted); font-size:12.5px;
    }

    /* Mobile tweaks */
    @media (max-width:640px){
      .viewer{height:72svh}
      .card-title{font-size:16px}
      .btn{padding:7px 11px; font-size:12.5px}
      .actions{gap:6px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Top header -->
    <header class="header">
      <div class="logo">BL_Technolas.png</div>
      <button id="themeBtn" class="btn secondary" type="button">Theme</button>
    </header>

    <!-- Main card -->
    <section class="card">
      <div class="card-head">
        <div class="card-title">SeeLyra Acty Guide Support — PDF</div>
        <div class="actions">
          <button id="openBtn" class="btn" type="button">Open</button>
          <a id="downloadBtn" class="btn" download="TPV-Munich.pdf">Download</a>
          <button id="fullscreenBtn" class="btn" type="button">Full screen</button>
        </div>
      </div>

      <!-- Inline pdf.js viewer -->
      <div class="viewer" id="viewer">
        <iframe id="pdfIframe" allow="fullscreen"></iframe>
      </div>

      <div class="foot">
        <div>Tip: Pinch to zoom inside the viewer.</div>
        <div>Powered By Technolas Bausch + Lomb</div>
      </div>
    </section>
  </div>

  <script>
    /* ======== CONFIG ======== */
    // Your PDF lives next to index.html. Keep the space encoded as %20.
    const pdfPath   = 'TPV%20Munich.pdf';

    // IMPORTANT: Pass the file parameter to viewer.html,
    // otherwise the pdf.js sample opens.
    const viewerSrc = `./pdfjs/web/viewer.html?file=../${pdfPath}#zoom=page-width`;

    // Elements
    const iframe   = document.getElementById('pdfIframe');
    const viewerEl = document.getElementById('viewer');

    // Load the pdf.js viewer with your file
    iframe.src = viewerSrc;

    // Buttons
    document.getElementById('openBtn').onclick = () =>
      window.open(pdfPath, '_blank', 'noopener,noreferrer');

    document.getElementById('downloadBtn').href = pdfPath;

    document.getElementById('fullscreenBtn').onclick = async () => {
      try{
        if (!document.fullscreenElement) {
          await (viewerEl.requestFullscreen?.() || document.documentElement.requestFullscreen?.());
        } else {
          await (document.exitFullscreen?.());
        }
      } catch(e){ console.error('Fullscreen error:', e); }
    };
    document.addEventListener('fullscreenchange', () => {
      const b = document.getElementById('fullscreenBtn');
      b.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    });

    // Theme toggle
    const themes = ['teal','deep','light'];
    const saved = localStorage.getItem('pdf_theme') || 'teal';
    if (themes.includes(saved)) document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'teal';
      const next = themes[(themes.indexOf(cur)+1)%themes.length];
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pdf_theme', next);
    };

    // Optional: If you rotate the phone, reload viewer to keep page-width fit
    let reflowTimer;
    window.addEventListener('resize', () => {
      clearTimeout(reflowTimer);
      reflowTimer = setTimeout(() => { iframe.src = viewerSrc; }, 220);
    });
  </script>
</body>
</html>
``
