
<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quick Guide: RealWear Navigator 520</title>

  <style>
    /* ========= THEME ========= */
    :root{
      --accent:#089ca4; --accent-2:#16c4cf;
      --bg:#0b1020; --bg-2:#0f152e;
      --card:rgba(255,255,255,.08);
      --text:#e8ecf4; --muted:#b7c1d6;
      --border:rgba(255,255,255,.18);
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    html[data-theme="deep"]{
      --accent:#4f72ff; --accent-2:#71a1ff;
      --bg:#0b0f1e; --bg-2:#0e1632; --card:rgba(255,255,255,.10);
      --text:#e9eeff; --muted:#bac6ea; --border:rgba(255,255,255,.18);
    }
    html[data-theme="light"]{
      --accent:#089ca4; --accent-2:#16c4cf;
      --bg:#f6f8fb; --bg-2:#ffffff; --card:rgba(0,0,0,.04);
      --text:#0f182a; --muted:#4b5a78; --border:rgba(0,0,0,.12);
    }

    /* ========= BASE LAYOUT ========= */
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--accent) 28%, transparent), transparent 55%),
        radial-gradient(1000px 600px at 120% 10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .wrap{max-width:1100px;margin:28px auto;padding:0 16px}

    /* Header */
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .logo { color:var(--muted); font-weight:700; font-size:14px; }

    /* Buttons */
    .btn{
      appearance:none;border:0;cursor:pointer;text-decoration:none;white-space:nowrap;
      padding:8px 12px;border-radius:12px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      box-shadow:0 6px 18px color-mix(in oklab, var(--accent) 45%, transparent);
      display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease,filter .15s ease;
      font-size:13.5px; line-height:1;
    }
    .btn.secondary{ color:var(--text); background:transparent; border:1px solid var(--border); box-shadow:none; }
    .btn.icon{ font-size:17px; padding:7px 10px; } /* ⛶ icon button */
    .btn:active{transform:scale(.97)}

    /* Card */
    .card{
      border-radius:18px; overflow:hidden;
      background:linear-gradient(180deg,var(--card),var(--card));
      border:1px solid var(--border); box-shadow:var(--shadow);
      backdrop-filter:saturate(120%) blur(6px);
    }
    .card-head{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:12px 16px; border-bottom:1px solid var(--border);
    }
    .card-title{ font-weight:900; font-size:18px; }
    .actions{ display:flex; gap:8px; flex-wrap:wrap; }

    /* Viewer */
    .viewer{ position:relative; height:75svh; background:#000; overflow:hidden; }
    /* We put the iframe inside a scale wrapper so we can "shrink" on iOS if needed */
    .scaleWrap{
      width:100%; height:100%;
      transform-origin: top center;
    }
    .viewer iframe{ width:100%; height:100%; border:0; display:block; background:#121212; }

    /* iOS banner */
    .iosBanner{
      position:absolute; left:12px; right:12px; top:12px;
      display:flex; align-items:center; gap:10px; justify-content:space-between;
      padding:10px 12px;
      background:rgba(0,0,0,.55);
      border:1px solid var(--border);
      border-radius:12px;
      color:#fff; font-size:13px;
      z-index:3;
    }
    .iosBanner .small{opacity:.9; font-size:12.5px}
    .iosBanner .row{display:flex; gap:8px; align-items:center}
    .iosBanner .close{background:transparent;border:0;color:#fff;opacity:.8;cursor:pointer;font-size:18px;line-height:1}

    /* Footer */
    .foot{
      padding:10px 16px; border-top:1px solid var(--border);
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      color:var(--muted); font-size:12.5px;
    }

    /* Mobile */
    @media (max-width:640px){
      .viewer{height:72svh}
      .card-title{font-size:16px}
      .btn{padding:7px 11px;font-size:12.5px}
      .btn.icon{font-size:16px;padding:6px 9px}
      .actions{gap:6px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="header">
      <div class="logo">BL_Technolas.png</div>
      <button id="themeBtn" class="btn secondary" type="button">Theme</button>
    </header>

    <section class="card">
      <div class="card-head">
        <div class="card-title">Quick Guide: RealWear Navigator 520</div>
        <div class="actions">
          <button id="openBtn" class="btn" type="button">Open</button>
          <a id="downloadBtn" class="btn" download="TPV-Munich.pdf">Download</a>
          <button id="fullscreenBtn" class="btn icon" type="button" title="Full screen" aria-label="Full screen">⛶</button>
        </div>
      </div>

      <div class="viewer" id="viewer">
        <!-- iOS tip banner (hidden by default) -->
        <div id="iosBanner" class="iosBanner" style="display:none">
          <div class="small">On iPhone/iPad, embedded PDFs can look zoomed. Tap <b>Open</b> for best view.</div>
          <div class="row">
            <a id="bannerOpen" class="btn" href="#" target="_blank" rel="noopener">Open</a>
            <button class="close" id="bannerClose" title="Dismiss" aria-label="Dismiss">×</button>
          </div>
        </div>

        <!-- Direct PDF (no pdf.js) -->
        <div id="scaleWrap" class="scaleWrap">
          <iframe id="pdfFrame" allow="fullscreen"></iframe>
        </div>
      </div>

      <div class="foot">
        <div>Tip: Pinch to zoom inside the viewer.</div>
        <div>Powered By Technolas Bausch + Lomb</div>
      </div>
    </section>
  </div>

  <script>
    // ===== CONFIG =====
    const pdfUrl = 'TPV%20Munich.pdf'; // keep name & case exact

    const frame     = document.getElementById('pdfFrame');
    const scaleWrap = document.getElementById('scaleWrap');
    const viewerEl  = document.getElementById('viewer');

    const iosBanner = document.getElementById('iosBanner');
    const bannerOpen= document.getElementById('bannerOpen');
    const bannerClose=document.getElementById('bannerClose');

    // Device detection
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/.test(ua);
    const isMobile = isIOS || isAndroid;

    // ===== PDF LOAD with best-effort zoom =====
    // Many engines honor #view=FitH (fit width) or #zoom=<percent>.
    // iOS often ignores these, so we also apply a CSS scale as a backup.
    function buildPdfSrc() {
      if (isMobile) {
        // Start smaller on phones
        return `${pdfUrl}#zoom=85`;
      }
      // Desktop: fit horizontally
      return `${pdfUrl}#view=FitH`;
    }

    function loadPDF(){
      frame.src = buildPdfSrc();
    }
    loadPDF();

    // Buttons
    document.getElementById('openBtn').onclick = () => window.open(pdfUrl,'_blank','noopener,noreferrer');
    document.getElementById('downloadBtn').href = pdfUrl;

    // Fullscreen (use container so controls remain visible on exit)
    document.getElementById('fullscreenBtn').onclick = async () => {
      try{
        if (!document.fullscreenElement) {
          await (viewerEl.requestFullscreen?.() || document.documentElement.requestFullscreen?.());
        } else {
          await (document.exitFullscreen?.());
        }
      }catch(e){ console.error('Fullscreen error:', e); }
    };

    // Theme toggle
    const themes = ['teal','deep','light'];
    const saved = localStorage.getItem('pdf_theme') || 'teal';
    if (themes.includes(saved)) document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeBtn').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'teal';
      const next = themes[(themes.indexOf(cur)+1)%themes.length];
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pdf_theme', next);
    };

    // ===== iOS fallback banner + visual scale for better fit =====
    // Show banner on iOS, and gently scale the iframe as backup (e.g., 0.9)
    function applyMobileScaling(){
      if (isIOS) {
        // Show the tip banner
        iosBanner.style.display = 'flex';
        bannerOpen.href = pdfUrl;
        bannerClose.onclick = () => iosBanner.style.display = 'none';

        // Apply a CSS scale (backup if #zoom is ignored by the engine)
        const scale = 0.90;                 // smaller = more of the page visible
        scaleWrap.style.transform = `scale(${scale})`;
        // Expand wrapper so the scaled content still fills the viewport box
        scaleWrap.style.width  = `${100/scale}%`;
        scaleWrap.style.height = `${100/scale}%`;
      } else if (isAndroid) {
        // Android usually honors #zoom; no extra scaling needed
        scaleWrap.style.transform = 'none';
        scaleWrap.style.width = '100%';
        scaleWrap.style.height = '100%';
      }
    }
    applyMobileScaling();

    // Re-apply on orientation change / resize (helps FitH and scaling)
    let resizeTo;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTo);
      resizeTo = setTimeout(() => {
        loadPDF();
        applyMobileScaling();
      }, 220);
    });

    // Optional: if the PDF fails to render at all, show the banner as guidance
    setTimeout(() => {
      const likelyBlocked = !frame.contentDocument && frame.src;
      if (isIOS && likelyBlocked) {
        iosBanner.style.display = 'flex';
      }
    }, 1000);
  </script>
</body>
</html>
