
<!DOCTYPE html>
<html lang="en" data-theme="teal">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Quick Guide – RealWear Navigator 520</title>

  <style>
    :root{
      --accent:#089ca4; --accent-2:#16c4cf;
      --bg:#0b1020; --bg-2:#0f152e;
      --card:rgba(255,255,255,.08);
      --text:#e8ecf4; --muted:#b7c1d6;
      --border:rgba(255,255,255,.18);
      --shadow-lg:0 10px 30px rgba(0,0,0,.35);
    }
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--accent) 28%, transparent), transparent 55%),
        radial-gradient(1000px 600px at 120% 10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--bg-2));
      font:15px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}

    .header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
    .logo-img{width:420px;max-width:100%;height:auto;display:block}

    .card{
      border-radius:18px; overflow:hidden;
      background:linear-gradient(180deg,var(--card),var(--card));
      box-shadow:var(--shadow-lg); border:1px solid var(--border);
      backdrop-filter:saturate(120%) blur(6px);
    }
    .card-head{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:14px 20px; border-bottom:1px solid var(--border);
    }
    .card-title{font-weight:800; font-size:18px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end}

    .btn{
      appearance:none;border:none;cursor:pointer;text-decoration:none;
      padding:10px 14px;border-radius:12px;font-weight:800;color:#fff;
      background:linear-gradient(135deg,var(--accent),var(--accent-2));
      box-shadow:0 6px 18px color-mix(in oklab, var(--accent) 45%, transparent);
      display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease, filter .15s ease;
      font-size:15px; line-height:1; white-space:nowrap;
    }
    .btn:active{transform:scale(.97)}
    .btn.secondary{color:var(--text);background:transparent;border:1px solid var(--border);box-shadow:none}
    .btn.sm{padding:7px 11px;border-radius:10px;font-size:13px}

    .viewer{height:75svh;background:#000;position:relative}
    .viewer iframe{width:100%;height:100%;border:0;display:block;background:#121212}

    .fallback{
      position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:12px;padding:20px;text-align:center;background:#0f0f0f;color:#dcdcdc
    }
    .fallback.hidden{display:none}

    .foot{padding:10px 20px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);
          display:flex;justify-content:space-between;gap:10px;align-items:center}

    @media (max-width:640px){
      .viewer{height:72svh}
      .card-head{gap:8px}
      .actions{gap:6px}
      .btn{padding:8px 12px;font-size:13.5px}
      .btn.sm{padding:6px 10px;font-size:12.5px}
      .card-title{font-size:16px}
      .actions>*{flex:0 0 auto}
    }
    @media (max-width:360px){
      .btn{font-size:12.5px;padding:7px 10px}
      .btn.sm{font-size:12px;padding:6px 9px}
    }
  </style>
</head>

<body>
<div class="wrap">

  <!-- Header -->
  <header class="header">
    BL_Technolas.png
    <button class="btn secondary sm" id="themeBtn" title="Change theme">Theme</button>
  </header>

  <!-- Card -->
  <section class="card">
    <div class="card-head">
      <div class="card-title">SeeLyra Acty Guide Support — PDF</div>
      <div class="actions">
        <button class="btn sm" id="openBtn" title="Open in new tab">Open</button>
        <a class="btn sm" id="downloadBtn" download="TPV-Munich.pdf" title="Download PDF">Download</a>
        <button class="btn sm" id="fullscreenBtn">Full screen</button>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <!-- pdf.js viewer embedded inline -->
      <iframe id="pdfIframe" allow="fullscreen"></iframe>

      <!-- Fallback (shows only if viewer fails) -->
      <div class="fallback hidden" id="fallbackMsg">
        <strong>Can’t display the PDF here.</strong>
        <div>Use <b>Open</b> to view it in a new tab.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <a class="btn sm" id="fallbackOpen">Open</a>
          <a class="btn sm secondary" id="fallbackDownload" download="TPV-Munich.pdf">Download</a>
        </div>
      </div>
    </div>

    <div class="foot">
      <div>Tip: Pinch to zoom inside the viewer.</div>
      <div>Powered By Technolas Bausch + Lomb</div>
    </div>
  </section>

</div>

<script>
  /* === CONFIG === */
  const pdfPath   = 'TPV%20Munich.pdf'; // file sits next to index.html
  // IMPORTANT: include file=../... or the viewer shows its sample PDF
  const viewerSrc = `./pdfjs/web/viewer.html?file=../${pdfPath}#zoom=page-width`;

  const iframe  = document.getElementById('pdfIframe');
  const viewer  = document.getElementById('viewer');
  const fallbackMsg = document.getElementById('fallbackMsg');

  const openBtn = document.getElementById('openBtn');
  const dlBtn   = document.getElementById('downloadBtn');
  const fsBtn   = document.getElementById('fullscreenBtn');
  const themeBtn= document.getElementById('themeBtn');

  const fbOpen = document.getElementById('fallbackOpen');
  const fbDl   = document.getElementById('fallbackDownload');

  // Load viewer
  iframe.src = viewerSrc;

  // Buttons
  openBtn.onclick = () => window.open(pdfPath, '_blank', 'noopener,noreferrer');
  [dlBtn, fbDl].forEach(a => a.href = pdfPath);
  fbOpen.href = pdfPath;

  // Fullscreen
  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        await (viewer.requestFullscreen?.call(viewer) || viewer.webkitRequestFullscreen?.call(viewer));
      } else {
        await (document.exitFullscreen?.call(document) || document.webkitExitFullscreen?.call(document));
      }
    } catch (e) { console.error('Fullscreen error:', e); }
  }
  fsBtn.onclick = toggleFullscreen;
  document.addEventListener('fullscreenchange', () => {
    fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  });

  // Theme toggle
  const themes = ['teal','deep','light'];
  const saved = localStorage.getItem('pdf_theme') || 'teal';
  if (themes.includes(saved)) document.documentElement.setAttribute('data-theme', saved);
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'teal';
    const idx = themes.indexOf(current);
    const next = themes[(idx + 1) % themes.length];
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('pdf_theme', next);
  });

  // Fallback if viewer fails
  setTimeout(() => {
    if (!iframe.contentWindow) {
      fallbackMsg.classList.remove('hidden');
    } else {
      fallbackMsg.classList.add('hidden');
    }
  }, 1200);

  // Refit on orientation change
  let resizeTo;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTo);
    resizeTo = setTimeout(() => { iframe.src = viewerSrc; }, 220);
  });
</script>
</body>
</html>
